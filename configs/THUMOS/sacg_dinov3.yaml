# Explicit publication configuration; see README.md for data prerequisites.
DATA:
  DATA_NAME: THUMOS
  DATA_INFO: data/data_info.json
  DATA_ROOT: data/THUMOS
  METRICS: AP
INPUT:
  MODALITY: twostream
  VISUAL_FEATURE: dinov3_vit7b16_rgb_fps24_len6_pos4_stride6_h448_w448
  MOTION_FEATURE: flow_kinetics_bninception
  OBJECT_FEATURE: flow_kinetics_bninception
  TARGET_PERFRAME: target_perframe
MODEL:
  MODEL_NAME: CMeRT
  FEATURE_HEAD:
    LINEAR_ENABLED: true
    LINEAR_OUT_FEATURES: 1024
  LSTR:
    NUM_HEADS: 8
    DIM_FEEDFORWARD: 1024
    DROPOUT: 0.0
    ACTIVATION: relu
    ASSA_TAU: 1.0
    ASSA_INIT_W:
    - 0.0
    - 0.0
    LONG_MEMORY_SECONDS: 256
    LONG_MEMORY_SAMPLE_RATE: 4
    LONG_MEMORY_USE_PE: false
    LONG_MEMORY_INCLUDE_WORK: true
    WORK_MEMORY_SECONDS: 4
    WORK_MEMORY_SAMPLE_RATE: 1
    CONTEXT_SECONDS: 0.5
    CONTEXT_MEMORY_SAMPLE_RATE: 1
    FUTURE_SECONDS: 12
    FUTURE_SAMPLE_RATE: 1
    ANTICIPATION_SECONDS: 2
    REFINE_TIMES: 1
    ENC_MODULE:
    - - 16
      - 1
      - true
    - - 32
      - 2
      - true
    DEC_MODULE:
    - -1
    - 2
    - true
    GEN_MODULE:
    - 32
    - 2
    - true
    FUT_MODULE:
    - - 48
      - 1
      - true
    ENC_ATTENTION_TYPE: dotproduct
    LONG_COMPRESS_M0_ATTENTION_TYPE: dotproduct
    LONG_COMPRESS_SELF_ATTN_TYPE: dotproduct
    LONG_COMPRESS_CROSS_ATTN_TYPE: dotproduct
    DEC_SELF_ATTN_TYPE: dotproduct
    DEC_CROSS_ATTN_TYPE: dotproduct
    GEN_SELF_ATTN_TYPE: dotproduct
    REFINE_SELF_ATTN_TYPE: dotproduct
    REFINE_CROSS_ATTN_TYPE: dotproduct
    LONG_COMPRESS_STAGE0_ATTN_TYPE: dotproduct
    LONG_COMPRESS_STAGE0_SELF_ATTN_TYPE: dotproduct
    LONG_COMPRESS_STAGE0_CROSS_ATTN_TYPE: dotproduct
    LONG_COMPRESS_STAGE1_ATTN_TYPE: dotproduct
    LONG_COMPRESS_STAGE1_SELF_ATTN_TYPE: dotproduct
    LONG_COMPRESS_STAGE1_CROSS_ATTN_TYPE: dotproduct
    LONG_COMPRESS_MQ_MOE: false
    DEC_MQ_MOE: false
    REFINE_MQ_MOE: false
    GEN_MQ_MOE: false
    INFERENCE_MODE: batch
    GEN_CROSS_ASSA_INIT_W:
    - 0.0
    - 0.0
    GEN_CROSS_ATTN_TYPE: assa
    GEN_CONTRANORM: true
    GEN_CONTRANORM_POS: cross
    GEN_CONTRANORM_SCALE: 0.08
    GEN_CONTRANORM_TEMP: 1.0
    GEN_CONTRANORM_DUAL_NORM: false
    GEN_CONTRANORM_LEARNABLE: false
    GEN_CONTRANORM_POSITIVE: false
    GEN_CONTRANORM_IDENTITY: false
    GEN_CONTRANORM_PRE_NORM: false
    ATTENTION_RESIDUAL: false
    FC_NORM: false
  CRITERIONS:
  - - MCE
    - {}
  PP_SIZE: 5
  CHECKPOINT: ''
DATA_LOADER:
  BATCH_SIZE: 32
  NUM_WORKERS: 8
  PIN_MEMORY: true
  TYPE: ''
SOLVER:
  NUM_EPOCHS: 16
  OPTIMIZER: adam
  BASE_LR: 2e-04
  WEIGHT_DECAY: 5e-05
  SAVE_EVERY: 1
  S1_W: 0.1
  S2_W: 1.0
  F_W: 0.5
  SCHEDULER:
    SCHEDULER_NAME: warmup_cosine
    WARMUP_FACTOR: 0.3
    WARMUP_EPOCHS: 10.0
    WARMUP_METHOD: linear
SEED: 0
OUTPUT_DIR: outputs
SESSION: seed0
